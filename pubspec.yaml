name: telly_app
description: "The Beli for Television — Pairwise Ranking and Social Discovery"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Architecture & State Management ---
  flutter_riverpod: ^2.5.1
  json_annotation: ^4.9.0

  # --- Routing & Deep Linking ---
  go_router: ^14.2.7

  # --- Networking & API ---
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0
  graphql_flutter: ^5.1.2
  supabase_flutter: ^2.6.0

  # --- Local Persistence & Offline-First (Drift SQLite) ---
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.6
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # --- UI, Animations & Card Duel Physics ---
  flutter_animate: ^4.5.0
  flutter_card_swiper: ^7.0.0
  reorderables: ^0.6.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0
  google_fonts: ^6.2.1

  # --- Utilities, Media & Ingestion ---
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  csv: ^6.0.0
  connectivity_plus: ^7.3.2
  file_picker: ^10.2.4
  share_plus: ^12.0.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  flutter_cache_manager: ^3.4.5
  posthog_flutter: ^5.50.13
  sentry_flutter: ^8.9.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.28.0
  mockito: ^5.4.4
  http: ^1.2.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - docs/legal/

