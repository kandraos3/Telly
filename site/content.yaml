# Copy and structure of the Telly website.
# Spec: docs/design_system/05_WEBSITE.md (five chapters and a playable duel, #254).
#
# Colors, type and screenshots are NOT set here: they come from the app on every
# build (lib/core/theme/, tool/site/src/scenes.dart). This file holds words,
# which screenshot goes where, and links.
#
# - `screenshots` must be ids of scenes in tool/site/src/scenes.dart.
# - `accent` must be a color token from lib/core/theme/telly_colors.dart
#   (camelCase name, e.g. phosphorLime, neonCoral).
# - Build locally: bash tool/site/build.sh, then open build/site/index.html.

site:
  name: Telly
  # Absolute URL the site is served from, with a trailing slash. Change it when
  # a custom domain is set up (and add a CNAME file under site/static/).
  url: https://kandraos3.github.io/Telly/
  title: Telly — Rank every movie and show you watch
  description: >-
    Telly turns what you watch into personal rankings. Track every episode,
    place every movie and series with quick head-to-head duels, compare taste
    with friends, and earn medals along the way.
  contact_email: karlandraos@gmail.com
  copyright_holder: Telly

# Store listings. Leave a link null until the listing is live: the page shows a
# "Coming soon" badge instead. Paste the full listing URL to switch it on.
stores:
  app_store: null
  play_store: null

hero:
  eyebrow: Movies · Series · Anime
  headline: Rank what you watch.
  tagline: Your personal TV rankings. Ranked, shared, settled.
  body: >-
    Telly asks one question: which did you like more? Try it with two of the
    best-rated shows on TV. Every answer puts a title in its exact place, with
    a score to match.
  # The playable duel (spec §2). Titles in a pair come from one ranking only.
  duel:
    media_type: tv
    total: 40
    pairs:
      - [Breaking Bad, The Sopranos]
      - [The Wire, Succession]
      - [Chernobyl, Band of Brothers]
      - [Fleabag, The Bear]

chapters:
  - id: track
    name: Track
    summary: Episodes and tonight's watch
    title: Always know what's on tonight.
    accent: electricCyan
    screenshots: [home, watching]
    body: >-
      Home opens on the next episode of whatever you're watching. Tick
      episodes off as you go, and Telly keeps your place in every show, even
      the ones you paused months ago.
    cards:
      - title: Tonight
        body: Your next episode, ready to mark watched in one tap.
      - title: Your moves
        body: A finished show to rank, a new season, a challenge close to done.

  - id: rank
    name: Rank
    summary: Duels, scores and your podium
    title: Duels, not stars.
    accent: phosphorLime
    screenshots: [reveal, canon]
    body: >-
      Finished something? Pick which you liked more a few times, and binary
      search finds its exact slot, even with hundreds of titles ranked. Your
      rank becomes a score from 1.00 to 10.00, so a 9.61 always sits above a
      9.42.
    points:
      - Movies only duel movies, and series only duel series
      - A podium for your top three in each ranking
      - Share the score reveal straight to your story
    show_tiers: true

  - id: discover
    name: Discover
    summary: Explore and your queue
    title: Find the next one without scrolling for an hour.
    accent: electricViolet
    screenshots: [explore, queue]
    body: >-
      Explore builds rows from your own rankings and your friends' favourites,
      and hides anything you mark "Not for me". Save anything to your queue, which
      knows where it's streaming and what's about to leave.
    cards:
      - title: Up next
        body: One pick from your queue for nights you can't decide.
      - title: Two-to-Watch
        body: Titles you'll both enjoy, on the services you share.

  - id: friends
    name: Friends
    summary: Upsets, Taste Match and squads
    title: Upsets worth arguing about.
    accent: neonCoral
    screenshots: [feed, taste-match]
    body: >-
      See what friends rank the moment they rank it. When someone puts
      Severance above Succession, Telly flags the upset, and Taste Match shows
      who really shares your taste.
    cards:
      - title: Find your people
        body: Search by name, and keep your profile public or friends-only.
      - title: Squads
        body: One shared ranking for the group chat, the film club or the couch.

  - id: play
    name: Play
    summary: Medals, challenges and levels
    title: Watching, with a scoreboard.
    accent: warmAmber
    screenshots: [achievements, level]
    body: >-
      Earn medals for what you watch, finish a director's collection, join a
      monthly challenge with your squad, and level up every week you keep your
      streak.
    points:
      - Gold, silver, bronze and special medals to pin on your profile
      - Weekly quests and a table to climb with friends
      - Rewards that change how your profile and rankings look

extras:
  - title: Bring your history
    body: Import your Letterboxd diary or AniList library and start with full rankings.
  - title: Works offline
    body: Rank on the subway. Duels save instantly and sync when you're back online.
  - title: Your data, exportable
    body: Export your rankings to CSV or Letterboxd format whenever you like.

cta:
  title: Your rankings are waiting.
  body: Telly is coming soon to iPhone and Android.
