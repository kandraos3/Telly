name: Telly Unified CI Quality Gates (DEV-602)

# `main` is protected (#158): every change lands through a pull request, and the
# `CI passed` job at the bottom is the required check that gates the merge.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual runs ("Run workflow") always run every job.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: read lets the change filter list a PR's files through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Which areas this push or PR touched (#122). Each job below runs only when its area changed.
  # Editing this workflow, or a manual run, runs everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      emulator: ${{ steps.filter.outputs.emulator == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      database: ${{ steps.filter.outputs.database == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      functions: ${{ steps.filter.outputs.functions == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      agents: ${{ steps.filter.outputs.agents == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      challenges: ${{ steps.filter.outputs.challenges == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'tool/**/*.dart'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'dart_test.yaml'
            emulator:
              - 'lib/**'
              - 'integration_test/**'
              - 'android/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'test/fakes/**'
              - 'test/helpers/**'
              - 'test/features/**/*_fixtures.dart'
            database:
              - 'supabase/migrations/**'
              - 'supabase/tests/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
            functions:
              - 'supabase/functions/**'
            challenges:
              - 'content/**'
              - 'tool/challenges/**'
            agents:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'GEMINI.md'
              - '.agents/**'
              - '.claude/**'
              - 'tool/agents/**'
              - 'tool/tracker/**'

  agent-instructions:
    name: Agent instructions in sync (AGENTS.md, skills, tracker stages)
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: AGENTS.md copies and skill mirrors match their sources
        run: python3 tool/agents/sync.py --check
      - name: Tracker config parses
        run: python3 -c "import json; [json.load(open(f)) for f in ('tool/tracker/stages.json', 'tool/tracker/labels.json')]"
      - name: Tracker tests
        run: python3 tool/tracker/test_tracker.py

  challenge-content:
    name: Challenge content validates (#143)
    needs: changes
    if: needs.changes.outputs.challenges == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Publisher tests
        run: python3 tool/challenges/test_publish.py
      - name: Dry run
        run: python3 tool/challenges/publish.py --dry-run

  static-analysis-and-unit-tests:
    name: Flutter Lint, Test Pyramid & Coverage Gate
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: "Quality Gate 1: Static Analysis & Strict Lints"
        run: dart analyze --fatal-infos

      - name: "Quality Gate 1.5: Enforce Modern Riverpod (Zero Legacy StateNotifier / StateProvider / ChangeNotifier)"
        run: |
          ! git grep -E "\b(StateNotifier|StateNotifierProvider|StateProvider|ChangeNotifier)\b" lib/

      - name: "Quality Gate 2: Automated Test Pyramid with Coverage"
        run: |
          set -o pipefail
          flutter test --coverage --test-randomize-ordering-seed=random --exclude-tags=a11y --reporter=expanded 2>&1 | tee test_output.log
        shell: bash

      - name: "Log Test Failure Details on Failure"
        if: failure()
        run: |
          echo "=== EXTRACTING TEST FAILURES ==="
          if [ -f test_output.log ]; then
            grep -A 25 -B 1 "EXCEPTION CAUGHT" test_output.log | while IFS= read -r line; do
              echo "::error title=Test Exception::$line"
            done
            grep -E "(\[E\]|Failing tests:|Golden comparison diff|Golden \")" test_output.log | while IFS= read -r line; do
              echo "::error title=Test Failure Summary::$line"
            done
            tail -n 120 test_output.log
          fi
        shell: bash

      - name: "Upload Test Log on Failure"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-test-log
          path: test_output.log

      - name: "Quality Gate 3: Enforce Coverage Thresholds (80% Overall, 90% Ranking Domain)"
        run: dart run tool/check_coverage.dart

      - name: "Informational: Automated Accessibility Audit (QA-604)"
        continue-on-error: true
        run: |
          flutter test --tags=a11y --reporter=expanded

  database-pgtap-verification:
    name: Supabase pgTAP, RLS & Concurrency Gate (QA-601)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # Pinned (#193): `latest` asks the GitHub API for the newest release, which is rate
          # limited and failed jobs before any test ran. Bump it by hand when the CLI matters.
          version: 2.120.0

      - name: Start Local Supabase (Migrations + Seed)
        run: supabase start -x studio,imgproxy,vector,logflare,mailpit,realtime,storage-api,edge-runtime

      - name: Reset Database from Migrations
        run: supabase db reset

      - name: Run pgTAP Test Suite
        run: supabase test db

      - name: Concurrency Race Test for Ranking RPCs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          bash supabase/tests/concurrency/ranking_race.sh
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:64322/postgres

  edge-functions:
    name: Edge Function Unit Tests (Deno)
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Lint, Type-Check and Test
        run: |
          deno lint
          deno check */index.ts
          deno test --allow-env tests/

  android-emulator-integration:
    name: Android Emulator Integration Test (CUJ Acceptance)
    needs: changes
    if: needs.changes.outputs.emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Integration Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/app_test.dart

  # The one required status check on `main` (#158). Jobs skipped by the change
  # filter count as passed; a failed or cancelled job fails this one.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - changes
      - agent-instructions
      - challenge-content
      - static-analysis-and-unit-tests
      - database-pgtap-verification
      - edge-functions
      - android-emulator-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job ended as '$r'."; exit 1 ;; esac
          done
