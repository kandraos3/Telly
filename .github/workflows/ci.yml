name: Telly Unified CI Quality Gates (DEV-602)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis-and-unit-tests:
    name: Flutter Lint, Test Pyramid & Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: "Quality Gate 1: Static Analysis & Strict Lints"
        run: dart analyze --fatal-infos

      - name: "Quality Gate 1.5: Enforce Modern Riverpod (Zero Legacy StateNotifier / StateProvider / ChangeNotifier)"
        run: |
          ! git grep -E "\b(StateNotifier|StateNotifierProvider|StateProvider|ChangeNotifier)\b" lib/

      - name: "Quality Gate 2: Automated Test Pyramid with Coverage"
        run: flutter test --coverage --test-randomize-ordering-seed=random

      - name: "Quality Gate 3: Enforce Coverage Thresholds (80% Overall, 90% Ranking Domain)"
        run: dart run tool/check_coverage.dart

  database-pgtap-verification:
    name: Supabase pgTAP, RLS & Concurrency Gate (QA-601)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase (Migrations + Seed)
        run: supabase start -x studio,imgproxy,vector,logflare,mailpit,realtime,storage-api,edge-runtime

      - name: Reset Database from Migrations
        run: supabase db reset

      - name: Run pgTAP Test Suite
        run: supabase test db

      - name: Concurrency Race Test for Ranking RPCs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          bash supabase/tests/concurrency/ranking_race.sh
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:64322/postgres

  edge-functions:
    name: Edge Function Unit Tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint, Type-Check and Test
        run: |
          deno lint
          deno check */index.ts
          deno test --allow-env tests/

  android-emulator-integration:
    name: Android Emulator Integration Test (CUJ Acceptance)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Integration Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: flutter test integration_test/app_test.dart

