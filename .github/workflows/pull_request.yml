name: Pull Request Quality Gate & Test Pyramid (DEV-501)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  static-analysis-and-unit-tests:
    name: Flutter Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: "Stage 1: Quality Gate - Static Analysis (Zero Warnings/Lints)"
        run: dart analyze --fatal-infos

      - name: "Stage 2: Quality Gate - Test Suite with Coverage"
        run: flutter test --coverage

      - name: Check Code Coverage Threshold (>= 80%)
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully."
          fi

  database-pgtap-verification:
    name: Supabase pgTAP, RLS & Concurrency Gate (QA-601)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,vector,logflare,mailpit,realtime,storage-api,edge-runtime

      - name: Reset database from migrations
        run: supabase db reset

      - name: Run pgTAP suite (fails the build on any failing assertion)
        run: supabase test db

      - name: Concurrency race test for ranking RPCs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          bash supabase/tests/concurrency/ranking_race.sh
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:64322/postgres

  edge-functions:
    name: Edge Function Unit Tests (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint, type-check and test
        run: |
          deno lint
          deno check */index.ts
          deno test --allow-env tests/
