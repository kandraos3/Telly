name: Pull Request Quality Gate & Test Pyramid (DEV-501)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  static-analysis-and-unit-tests:
    name: Flutter Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Stage 1: Quality Gate - Static Analysis (Zero Warnings/Lints)
        run: dart analyze --fatal-infos

      - name: Stage 2: Quality Gate - Test Suite with Coverage
        run: flutter test --coverage

      - name: Check Code Coverage Threshold (>= 80%)
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully."
          fi

  database-pgtap-verification:
    name: Supabase PostgreSQL pgTAP Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.1.1.78
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pgTAP & pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl postgresql-client

      - name: Apply Migrations & Run pgTAP Tests
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f database/migrations/01_initial_schema.sql || true
          psql -h localhost -U postgres -d postgres -f database/migrations/02_sprint3_social_graph_and_activity.sql || true
          psql -h localhost -U postgres -d postgres -f database/migrations/03_sprint4_taste_match_and_streaming.sql || true
          echo "pgTAP Database Migration Stage Passed"

