# Native launch screen (FE-BRAND-01). Spec: docs/design_system/01_DESIGN_PHILOSOPHY_AND_STYLE_GUIDE.md §7.3.
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#08090C"
