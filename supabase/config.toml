# Supabase CLI project configuration
project_id = "telly-backend-prod"

[api]
enabled = true
port = 64321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 64322
shadow_port = 64320
major_version = 15

[studio]
enabled = true
port = 64323

[inbucket]
enabled = true
port = 64324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
port = 64326

# Scheduled functions authorise pg_cron by the JWT's service_role claim, which is only safe while
# the gateway verifies signatures (_shared/http.ts isServiceRoleRequest, #152). Keep these on.
[functions.tmdb-details]
verify_jwt = true

[functions.challenge-scheduler]
verify_jwt = true

[functions.tracking-refresh]
verify_jwt = true

# #227: also trusts the authenticated role claim for user requests.
[functions.tmdb-season]
verify_jwt = true

[functions.streaming-catalog-sync]
verify_jwt = true

# #177: also trusts the authenticated role claim for user requests.
[functions.title-related]
verify_jwt = true
